name: Principal Funds Daily NAV Dashboard

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Kuala_Lumpur (MYT has no DST, always UTC+8).
    # Mon-Fri only; the script additionally skips Malaysian public holidays.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run even if today is a weekend/holiday (for testing)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  nav-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NAV, build PDF, send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run && '1' || '' }}
        run: python scripts/fetch_nav_and_report.py

      - name: Commit illustrated PDF to reports/ (the "outputs folder" equivalent)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d reports ] && ! git diff --quiet -- reports; then
            git add reports
            git commit -m "Daily NAV report PDF: $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No new report file to commit."
          fi

      - name: Upload PDF as workflow artifact (backup copy, 30-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: principal-funds-dashboard
          path: reports/principal-funds-dashboard-*.pdf
          if-no-files-found: ignore
          retention-days: 30
